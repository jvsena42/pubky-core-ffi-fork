[package]
name = "pubkycore"
version = "0.4.0"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate_type = ["cdylib"]
name = "pubkycore"

[dependencies]
uniffi = { version = "0.25.3", features = [ "cli" ] }
serde_json = "1.0.114"
hex = "0.4.3"
sha2 = "0.10.8"
serde = { version = "^1.0.209", features = ["derive"] }
tokio = "1.40.0"
url = "2.5.2"
base64 = "0.22.1"
once_cell = "1.19.0"
reqwest = { version = "0.12.0", default-features = false, features = ["rustls-tls"] }
# **Do not go below 0.10.** 0.10 builds the ICANN HTTP client with webpki roots and revocation
# checking off (`icann_tls_config_without_revocation_check`). On 0.9.3 that client used reqwest's
# default verifier — rustls-platform-verifier — which hard-fails revocation on Android: Let's
# Encrypt no longer publishes an OCSP responder, Android's PKIXRevocationChecker only tries OCSP,
# and the AAR turns the resulting CertPathValidatorException into `StatusCode.Revoked`. Every
# homeserver read then died as `invalid peer certificate: Revoked` → `HTTP transport error`, which
# Loopky reports to users as "You're offline". Observed on-device 2026-08-24.
#
# The AAR's own escape hatch for this is gated on `BuildConfig.TEST`, so it never applies to a
# shipped app; rustls-platform-verifier 0.7.0 is the latest release and still carries the bug
# (their PR #179 is the pending real fix). Hence the floor here rather than a dependency bump.
pubky = "0.10.0"
bip39 = { version = "2.2.0", features = ["rand"] }
blake3 = "1.8.3"
base32 = "0.5.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Android-only: pkarr's relay HTTP client (via reqwest 0.13's `rustls` feature) uses
# rustls-platform-verifier, which must be handed the JVM + app Context once at startup
# before any TLS handshake. We expose a JNI entrypoint (see src/rustls_init.rs) that the
# Kotlin wrapper calls. Versions are pinned to match what pubky resolves so the
# rustls-platform-verifier `GLOBAL` static is the same instance across the dep graph.
# Still required until pkarr's relay client stops using the platform verifier (pkarr #262) —
# `cargo tree -i rustls-platform-verifier --target aarch64-linux-android` still shows reqwest 0.13
# pulling it in through pkarr 7.0, so this is not dead weight even after the pubky 0.10 bump.
#
# The consuming app must also ship the crate's *Kotlin* half
# (`org.rustls.platformverifier.CertificateVerifier`, in the AAR the `rustls-platform-verifier-android`
# crate vendors). `init` here succeeds without it and the first handshake then fails with
# "failed to call native verifier" — see loopky PR #122.
#
# `paranoid-android` routes the pubky SDK's `tracing` events to logcat so relay/TLS errors
# are visible; see `init_logging` in src/lib.rs.
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7.0"
jni = "0.22.4"
paranoid-android = "0.2.2"

[dev-dependencies]
tokio = { version = "1.40.0", features = ["full"] }
serde_json = "1.0.114"
hex = "0.4.3"
